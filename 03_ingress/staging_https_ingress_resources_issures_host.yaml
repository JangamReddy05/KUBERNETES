apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s_staging_ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - nginx.mahidevops.in
    - httpd.mahidevops.in
    secretName: devops-staging-tls
  rules:
  - host: nginx.mahidevops.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
  - host: httpd.mahidevops.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: httpd
            port:
              number: 80
