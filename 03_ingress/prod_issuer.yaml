apiVersion: cert-manager.io/v1
kind: IngressClusterIssuer
metadata:
  name: letsencrpt-prod
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mahidevops.in
    privateKeySecretRef:
      name: letsencrpt-prod
    solvers:
    - http01:
        ingress:
          name: nginx
