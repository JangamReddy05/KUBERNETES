#kind: # https://kubernetes.io/docs/reference/access-authn-authz/rbac/
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-log-reader-binding
  namespace: dev-team
subjects:
  - kind: User
    name: your-user-name
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: your-group-name
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io

