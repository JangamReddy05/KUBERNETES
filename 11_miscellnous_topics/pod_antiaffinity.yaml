apiVersion: apps/v1
kind: Deployment
metadata:
  name:  nginx-app
  labels:
    app: nginx-app
spec:
  selector:
    matchLabels:
      app: nginx-app
  replicas: 5
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx-app
        image: nginx
        ports:
        - containerPort:  80
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: env
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In 
                    values:
                    - nginx-app