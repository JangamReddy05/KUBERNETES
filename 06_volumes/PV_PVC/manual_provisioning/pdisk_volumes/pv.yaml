apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-disk-volume
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce    #first pod/ first node can read and write to the volume, other pods/nodes can only read from it
  persistentVolumeReclaimPolicy: Retain
  gcePersistentDisk:
    pdName: gke-pv
    fsType: ext4