apiVersion: apps/v1
kind: Deployment
metadata:
  name:  myapp
  labels:
    app: myapp
spec:
  selector:
    matchLabels:
      app: myapp
  replicas: 4
  template:
    metadata:
      labels:
        app:  myapp
    spec:
      containers:
      - name:  myapp-container
        image: nginx:1.19.0
        ports:
        - containerPort:  80
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: myapp
  ports:
   - port: 80
     targetPort: 80